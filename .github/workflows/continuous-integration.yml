name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install stylish-haskell
        run: |
          curl -sL https://github.com/haskell/stylish-haskell/releases/download/v0.15.1.0/stylish-haskell-v0.15.1.0-linux-x86_64.tar.gz | tar -xz
          sudo mv stylish-haskell-v0.15.1.0-linux-x86_64/stylish-haskell /usr/local/bin/stylish-haskell
          chmod +x /usr/local/bin/stylish-haskell
        shell: bash

      - name: Install rubyfmt
        run: |
          curl -sL https://github.com/fables-tales/rubyfmt/releases/download/v0.14.1/rubyfmt-v0.14.1-Linux-x86_64.tar.gz | tar -xz
          sudo mv rubyfmt-main /usr/local/bin/rubyfmt
          chmod +x /usr/local/bin/rubyfmt
        shell: bash

      - name: Install black
        run: pip install black
        shell: bash

      - run: pnpm install --frozen-lockfile
        shell: bash

      - run: pnpm run lint
        shell: bash